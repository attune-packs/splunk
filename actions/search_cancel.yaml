ref: splunk.search_cancel
label: "Cancel Splunk Search"
description: "Request cancellation of one search SID"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: splunk_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  credential_key: {type: string, default: "splunk.credentials", description: "Pack-owned encrypted Splunk credential Key ref"}
  sid: {type: string, required: true}
output:
  operation: {type: string, required: true}
  result: {type: object, required: true}
tags: [splunk, search, cancel]
