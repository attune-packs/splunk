ref: splunk.hec_event
label: "Send Splunk HEC Event"
description: "Send one bounded JSON event through the independently configured HEC endpoint and token"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: splunk_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  credential_key: {type: string, default: "splunk.credentials", description: "Pack-owned encrypted Splunk credential Key ref"}
  event: {type: object, required: true, description: "JSON object stored as the HEC event value"}
  time: {type: number, minimum: 0, maximum: 100000000000}
  host: {type: string}
  source: {type: string}
  sourcetype: {type: string}
  index: {type: string}
  fields: {type: object, description: "Optional flat indexed-fields object"}
  channel: {type: string, description: "Optional HEC channel for indexer acknowledgement"}
output:
  operation: {type: string, required: true}
  result: {type: object, required: true}
tags: [splunk, hec, event, ingestion]
